name: Docker Base Image

on:
  workflow_dispatch:
  # Rebuild every weekday so the `release` base tag carries the current OS
  # security updates. Every image build starts from this tag.
  schedule:
    - cron: "0 5 * * MON-FRI"
  push:
    branches:
      - release
    paths:
      - "deploy/docker/base.dockerfile"

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the head commit of the branch
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Builds from release publish the `release` tag, which every image build uses.
      # A manual run on another branch publishes a tag named after that branch, for testing.
      - name: Get tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build and push base image
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          context: .
          file: deploy/docker/base.dockerfile
          push: true
          pull: true
          # do not cache so we get fresh OS packages each time
          no-cache: true
          platforms: linux/arm64,linux/amd64
          tags: |
            ${{ vars.DOCKER_HUB_ORGANIZATION }}/base-${{ vars.EDITION }}:${{ steps.tag.outputs.tag }}
