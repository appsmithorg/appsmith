# If someone with write access uses an approved slash command on a pull request,
# emit a repository_dispatch event from the trusted GitHub App.
name: Ok To Test

on:
  issue_comment:
    types: [created]

jobs:
  ok-to-test:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is only used to add reactions to the command comment
    permissions:
      issues: write
      pull-requests: write
    # Only run for slash commands on PRs, not for every issue or PR comment
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/')
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPSMITH_INTEGRATION_TESTING_ID }}
          private-key: ${{ secrets.APPSMITH_INTEGRATION_TESTING_KEY }}
          # Scope the installation token to what dispatching needs:
          # reading the PR, checking the commenter's permission, and creating repository_dispatch events
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: read

      - name: Slash Command Dispatch
        uses: peter-evans/slash-command-dispatch@f996d7b7aae9059759ac55e978cff76d91853301 # v3.0.2
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
        with:
          token: ${{ env.TOKEN }} # GitHub App installation access token
          reaction-token: ${{ secrets.GITHUB_TOKEN }}
          issue-type: pull-request
          commands: |
            approve-ci
            ok-to-test
            ci-test-limit
            build-deploy-preview
            ci-test-limit-count
            test-pw
          permission: write
