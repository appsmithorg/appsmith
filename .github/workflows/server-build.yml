# This workflow is responsible for building, testing & packaging the Java server codebase
name: Appsmith Server Workflow

on:
  workflow_call:
    inputs:
      pr:
        description: "PR number for the workflow"
        required: false
        type: number
      skip-tests:
        description: "Skip tests flag"
        required: false
        type: string
        default: "false"
      branch:
        description: "Branch for the build"
        required: false
        type: string
      is-pg-build:
        description: "Flag for PG build"
        required: false
        type: string
        default: "false"
      checkout-ref:
        description: "Immutable commit SHA to checkout for an approved external PR"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      pr:
        description: "PR number for the workflow"
        required: false
        type: number
      skip-tests:
        description: "Skip tests flag"
        required: false
        type: string
        default: "false"
      branch:
        description: "Branch for the build"
        required: false
        type: string
      is-pg-build:
        description: "Flag for PG build"
        required: false
        type: string
        default: "false"

# Change the working directory for all the jobs in this workflow
defaults:
  run:
    working-directory: app/server

jobs:
  # The scheduled run on release saves per-class test durations to the Actions cache.
  # This job picks the newest entry once, so that every group plans from the same file.
  find-test-durations:
    if: inputs.skip-tests != 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.lookup.outputs.cache-matched-key }}
    steps:
      - name: Find the newest server test durations
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: server-test-durations.tsv
          key: server-test-durations-${{ github.run_id }}
          restore-keys: server-test-durations-
          lookup-only: true

  server-unit-tests:
    needs: find-test-durations
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04-8core

    # Each group runs a share of the test classes, balanced by the durations from the
    # last scheduled run on release. A build without tests uses one group.
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.skip-tests == 'true' && '[1]' || '[1, 2, 3, 4, 5]') }}

    # Service containers to run with this job. Required for running tests
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image for Redis
        image: redis
        ports:
          # Opens tcp port 6379 on the host and service container
          - 6379:6379

    steps:
      # The checkout steps MUST happen first because the default directory is set according to the code base.
      # GitHub Action expects all future commands to be executed in the code directory. Hence, we need to check out
      # the code before doing anything else.

      # Check out merge commit with the base branch in case this workflow is invoked via pull request
      - name: Check out merged commit from PR and base branch
        uses: actions/checkout@v4
        if: inputs.checkout-ref == '' && inputs.pr != 0
        with:
          fetch-tags: true
          ref: refs/pull/${{ inputs.pr }}/merge

      # Check out the specified branch in case this workflow is called by another workflow
      - name: Checkout the specified branch
        if: inputs.checkout-ref == '' && inputs.pr == 0 && inputs.branch != ''
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          ref: ${{ inputs.branch }}

      # Checkout the code in the current branch in case the workflow is called because of a branch push event
      - name: Check out the head commit of the branch
        uses: actions/checkout@v4
        if: inputs.checkout-ref == '' && inputs.pr == 0 && inputs.branch == ''
        with:
          fetch-tags: true

      - name: Check out the approved immutable commit
        if: inputs.checkout-ref != ''
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          ref: ${{ inputs.checkout-ref }}

      - name: Figure out the PR number
        env:
          PR: ${{ inputs.pr }}
        run: echo "$PR"

      - name: Default database URL
        env:
          IS_PG_BUILD: ${{ inputs.is-pg-build }}
        run: echo "Is this a PG build? $IS_PG_BUILD"

      - name: Print the Github event
        run: echo "$GITHUB_EVENT_NAME"

      - name: Get changed files in the server folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v46
        with:
          files: "app/server/**"
          write_output_files: true

      # - name: Updating the server changed file variable
      #   id: changed-files-specific
      #   run: echo "any_modified=true" >> "$GITHUB_OUTPUT"

      - name: Run step if any file(s) in the server folder change
        if: steps.changed-files-specific.outputs.any_modified == 'true'
        run: |
          echo "One or more files in the server folder has changed."
          echo "List all the files that have changed:"
          cat "$GITHUB_WORKSPACE/.github/outputs/all_modified_files.txt"

      # In case this is second attempt try restoring status of the prior attempt from cache
      - name: Restore the previous run result
        if: inputs.skip-tests != 'true' && (steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        id: cache-appsmith
        uses: actions/cache@v4
        with:
          path: |
            ~/run_result
          key: ${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-server-junit

      # Fetch prior run result
      - name: Get the previous run result
        if: inputs.skip-tests != 'true' && (steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        id: run_result
        run: |
          if [ -f ~/run_result ]; then
            echo "run_result=$(cat ~/run_result)" >> $GITHUB_OUTPUT
          else
            echo "run_result=default" >> $GITHUB_OUTPUT
          fi

      - name: Download the failed test artifact in case of rerun
        if: steps.run_result.outputs.run_result == 'failedtest' && (steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/download-artifact@v4
        with:
          name: failed-server-tests-${{ matrix.group }}
          path: ~/failed-server-tests

      - name: Extract the tests for rerun
        id: failed_tests
        if: steps.run_result.outputs.run_result == 'failedtest'
        run: |
          failed_tests=$(awk '$0 != "" && !seen[$0]++ {printf("%s%s",sep,$0); sep=","}' ~/failed-server-tests/failed-server-tests.txt)
          echo "$failed_tests"
          echo "tests=$failed_tests" >> $GITHUB_OUTPUT

      # In case of prior failure run the job
      - if: steps.run_result.outputs.run_result != 'success'  && (steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: echo "I'm alive!" && exit 0

      # Setup Java
      - name: Set up JDK from dependency file
        uses: ./.github/actions/setup-server-java

      - name: Conditionally start PostgreSQL
        if: |
          inputs.is-pg-build == 'true' && inputs.skip-tests != 'true'
        run: |
          docker run --name appsmith-pg -p 5432:5432 -d -e POSTGRES_PASSWORD=password postgres:alpine postgres -N 1500

      # Retrieve maven dependencies from cache. After a successful run, these dependencies are cached again
      - name: Cache maven dependencies
        if: steps.run_result.outputs.run_result != 'success'  && (matrix.group == 1 || steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/cache@v4
        env:
          cache-name: cache-maven-dependencies
        with:
          # maven dependencies are stored in `~/.m2` on Linux/macOS
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build the code. Group 1 always builds, because it uploads the server bundle.
      - name: Build
        if: steps.run_result.outputs.run_result != 'success'  && (matrix.group == 1 || steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          ./build.sh -DskipTests

      # Without this file, the groups are balanced by the number of test methods per class.
      - name: Restore the server test durations
        if: needs.find-test-durations.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: server-test-durations.tsv
          key: ${{ needs.find-test-durations.outputs.key }}

      # Test the code
      - name: Run only tests
        if: (inputs.skip-tests != 'true' || steps.run_result.outputs.run_result == 'failedtest')  && (steps.changed-files-specific.outputs.any_modified == 'true' ||  github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          ACTIVE_PROFILE: test
          APPSMITH_CLOUD_SERVICES_BASE_URL: "https://release-cs.appsmith.com"
          APPSMITH_CLOUD_SERVICES_TEMPLATE_UPLOAD_AUTH: ${{ secrets.APPSMITH_CLOUD_SERVICES_TEMPLATE_UPLOAD_AUTH }}
          APPSMITH_REDIS_URL: "redis://127.0.0.1:6379"
          APPSMITH_ENCRYPTION_PASSWORD: "password"
          APPSMITH_ENCRYPTION_SALT: "salt"
          APPSMITH_ENVFILE_PATH: /tmp/dummy.env
          APPSMITH_VERBOSE_LOGGING_ENABLED: false
          IS_PG_BUILD: ${{ inputs.is-pg-build }}
          RUN_RESULT: ${{ steps.run_result.outputs.run_result }}
          FAILED_TESTS: ${{ steps.failed_tests.outputs.tests }}
          GROUP: ${{ matrix.group }}
          GROUP_COUNT: ${{ strategy.job-total }}
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$IS_PG_BUILD" == "true" ]]; then
              export APPSMITH_DB_URL="postgresql://postgres:password@localhost:5432/postgres"
          else
              export APPSMITH_DB_URL="mongodb://localhost:27017/mobtools"
          fi

          args=("-DfailIfNoTests=false" "-Dsurefire.failIfNoSpecifiedTests=false")

          if [[ "$RUN_RESULT" == "failedtest" ]]; then
              args+=("-Dtest=$FAILED_TESTS")
          else
              group_tests="$(node "$GITHUB_WORKSPACE/.github/workflows/scripts/server-test-groups.js" plan \
                  --root . \
                  --durations "$GITHUB_WORKSPACE/server-test-durations.tsv" \
                  --groups "$GROUP_COUNT" \
                  --group "$GROUP")"
              if [[ -z "$group_tests" ]]; then
                  echo "Group $GROUP has no test classes."
                  exit 0
              fi
              args+=("-Dtest=$group_tests")
          fi

          # Run tests and capture logs
          mvn test "${args[@]}" | tee mvn_test.log

          # Check for "BUILD FAILURE" in the mvn_test.log
          if grep -q "BUILD FAILURE" mvn_test.log; then
              test_result="failed"
          else
              test_result="passed"
          fi

          echo "test_result variable value: ${test_result}"

          # Prepare output file for failed tests and ensure a fresh file is created
          OUTPUT_FILE="failed-server-tests.txt"
          rm -f "$OUTPUT_FILE"
          touch "$OUTPUT_FILE"

          skipped_modules=()

          # Process mvn_test.log for FAILURE and SKIPPED statuses
          while IFS= read -r line; do
              if [[ $line == *"SKIPPED"* ]]; then
                  module_name=$(echo "$line" | awk '{print $2}')
                  skipped_modules+=("$module_name")
              fi
          done < mvn_test.log

          echo "Skipped Modules: ${skipped_modules[*]}"

          # Handle older approach for reading failed tests from XML files
          failed_tests_from_xml="$PWD/failed-tests-from-xml.txt"
          gawk -F\" '/<testcase / {cur_test = $4 "#" $2} /<(failure|error) / {print cur_test}' $(find . -type f -name 'TEST-*.xml') \
            | sort -u \
            | tee "$failed_tests_from_xml"

          # Include all skipped module test files in the final list
          for module in "${skipped_modules[@]}"; do
              module_directories=$(find . -path "*/${module}*/src/test/java/*" -type f -name "*Test.java" -exec dirname {} \; | sort -u)
              for module_directory in $module_directories; do
                  test_classes=$(find "$module_directory" -type f -name "*Test.java" | sed 's|.*/src/test/java/||; s|\.java$||; s|/|.|g')
                  for class_name in $test_classes; do
                      if [[ ${#class_name} -le 240 ]] && ! grep -Fxq "$class_name#" "$OUTPUT_FILE"; then
                          echo "${class_name}#" >> "$OUTPUT_FILE"
                      fi
                  done
              done
          done

          # Combine the XML file test cases and skipped module test files into the final output file
          cat "$failed_tests_from_xml" >> "$OUTPUT_FILE"

          # Print the final output
          cat "$OUTPUT_FILE"

          if [[ -s $OUTPUT_FILE ]]; then
              content="$(
                  echo "## Failed server tests (group $GROUP of $GROUP_COUNT)"
                  echo
                  sed 's/^/- /' "$OUTPUT_FILE"
              )"
              echo "$content" >> "$GITHUB_STEP_SUMMARY"

              # Post a comment to the PR
              if [[ -n "$PR" && "$PR" != "0" ]]; then
                  curl --silent --show-error --max-time 30 \
                      --header "Authorization: Bearer $GITHUB_TOKEN" \
                      --data "$(jq -n --arg body "$content" '$ARGS.named')" \
                      "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                      > /dev/null
              fi
          fi

          # Fail the script if tests did not pass
          if [[ "$test_result" == "failed" ]]; then
              echo "Tests failed, exiting with status 1."
              exit 1
          fi

      # Set status = failedtest
      - name: Set fail if there are test failures
        if: failure()
        run: |
          echo "run_result=failedtest" >> $GITHUB_OUTPUT
          echo "failedtest" > ~/run_result

      # Force store previous run result to cache
      - name: Store the previous run result
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/run_result
          key: ${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-server-junit

      - name: Upload the failed tests report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-server-tests-${{ matrix.group }}
          path: app/server/failed-server-tests.txt
          if-no-files-found: ignore
          overwrite: true

      # The scheduled run on release records how long each test class took, for the
      # save-test-durations job. A rerun of failed tests covers only those tests, so it
      # keeps the first attempt's file.
      - name: Collect the server test durations
        if: ${{ !cancelled() && inputs.skip-tests != 'true' && steps.run_result.outputs.run_result != 'failedtest' && github.event_name == 'schedule' && github.ref == 'refs/heads/release' }}
        env:
          GROUP: ${{ matrix.group }}
        run: |
          node "$GITHUB_WORKSPACE/.github/workflows/scripts/server-test-groups.js" durations --reports . \
              > "$GITHUB_WORKSPACE/server-test-durations-group.tsv"
          echo "Group $GROUP: $(wc -l < "$GITHUB_WORKSPACE/server-test-durations-group.tsv") test classes with a duration"

      - name: Upload the server test durations
        if: ${{ !cancelled() && inputs.skip-tests != 'true' && steps.run_result.outputs.run_result != 'failedtest' && github.event_name == 'schedule' && github.ref == 'refs/heads/release' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-test-durations-${{ matrix.group }}
          path: server-test-durations-group.tsv
          if-no-files-found: ignore
          retention-days: 1

      # The OpenAPI document is written by OpenApiDocumentGenerationTest during the test run.
      # Runtime instances keep springdoc disabled; this artifact is the build's copy of the contract.
      # Only the group that runs that test has the document.
      - name: Upload the generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: app/server/appsmith-server/target/openapi/
          if-no-files-found: ignore
          overwrite: true

      # Restore the previous built bundle if present. If not push the newly built into the cache
      - name: Restore the previous bundle
        if: matrix.group == 1
        uses: actions/cache@v4
        with:
          path: |
            app/server/dist/
          key: ${{ github.run_id }}-${{ github.job }}-server

      # Upload the build artifact so that it can be used by the test & deploy job in the workflow
      - name: Upload server build bundle
        if: matrix.group == 1
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: app/server/dist/
          if-no-files-found: error
          overwrite: true

      - name: Save the status of the run
        run: echo "run_result=success" >> $GITHUB_OUTPUT > ~/run_result

  # Merges the durations of all groups and saves them for the next runs. Each run reads
  # the newest entry (see find-test-durations); the cache drops entries unused for 7 days.
  save-test-durations:
    needs: server-unit-tests
    if: ${{ !cancelled() && inputs.skip-tests != 'true' && github.event_name == 'schedule' && github.ref == 'refs/heads/release' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the group durations
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: server-test-durations-*
          path: group-durations

      - name: Merge the group durations
        id: merge
        run: |
          shopt -s nullglob
          files=(group-durations/*/*.tsv)
          if (( ${#files[@]} == 0 )); then
              echo "No group durations found; nothing to save."
              echo "save=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          awk -F '\t' 'NF == 2 { total[$2] += $1 } END { for (c in total) printf "%.1f\t%s\n", total[c], c }' "${files[@]}" \
              | sort -t "$(printf '\t')" -k 2 > server-test-durations.tsv
          echo "Merged ${#files[@]} groups: $(wc -l < server-test-durations.tsv) test classes"
          if [[ -s server-test-durations.tsv ]]; then
              echo "save=true" >> "$GITHUB_OUTPUT"
          else
              echo "save=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the server test durations
        if: steps.merge.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: server-test-durations.tsv
          key: server-test-durations-${{ github.run_id }}
