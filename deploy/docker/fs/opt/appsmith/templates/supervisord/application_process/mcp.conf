[program:mcp]
command=/opt/appsmith/run-with-env.sh /opt/appsmith/run-mcp.sh
autorestart=true
autostart=true
priority=16
startretries=3
# Require the process to stay up 5s to count as a successful start, so a crash-loop reaches FATAL
# (and stops) instead of restarting instantly and forever.
startsecs=5
# *_events_enabled routes this program's output through supervisord's [eventlistener:stdout] so it reaches the
# container's stdout (docker logs / kubectl logs). Without it the MCP process — which logs security-relevant events
# like a rejected internal marker — is invisible to every log-shipping pipeline an operator has.
# The size caps match rts.conf: supervisord otherwise defaults to 50MB x 10 backups per stream (~1.1GB) on the
# operator's persistent stacks volume, and MCP writes a structured line per request.
# The %(program_name)s/%(ENV_HOSTNAME)s path keeps replicas on a shared RWX volume from interleaving into one file.
stderr_events_enabled=true
stderr_logfile=%(ENV_APPSMITH_LOG_DIR)s/%(program_name)s/%(ENV_HOSTNAME)s-stderr.log
stderr_logfile_backups=0
stderr_logfile_maxbytes=30MB
stdout_events_enabled=true
stdout_logfile=%(ENV_APPSMITH_LOG_DIR)s/%(program_name)s/%(ENV_HOSTNAME)s-stdout.log
stdout_logfile_backups=0
stdout_logfile_maxbytes=30MB
