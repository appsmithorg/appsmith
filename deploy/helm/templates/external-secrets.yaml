{{- /*
External Secrets Operator integration.

Two independent mechanisms are supported, and both may be used together:

1. Legacy single-secret path (externalSecrets.enabled + externalSecrets.remoteSecretName):
   Creates one ExternalSecret named "<fullname>-external-secret" that pulls EVERY key
   from the named remote secret verbatim (dataFrom.extract). Behavior is unchanged from
   earlier chart versions, so existing deployments keep working as-is.

2. Additional secrets with per-key mapping (externalSecrets.additionalSecrets):
   A list of extra ExternalSecret resources. Each entry may rename individual remote keys
   to specific Kubernetes Secret keys via `data` (per-key mapping) — e.g. to turn an AWS
   Secrets Manager secret whose keys are host/port/password into the APPSMITH_REDIS_HOST/
   APPSMITH_REDIS_PORT/APPSMITH_REDIS_PASSWORD env vars Appsmith expects — or pull all keys
   verbatim via `dataFrom`. Each generated Secret is wired into the pod through envFrom in
   deployment.yaml.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
   name: "{{ include "appsmith.fullname" . }}-external-secret"
   namespace: {{ include "appsmith.namespace" . }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | default "secretstore" }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: "{{ include "appsmith.fullname" . }}-external-secret"
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: {{ .Values.externalSecrets.remoteSecretName }}
{{- end }}
{{- range $secret := .Values.externalSecrets.additionalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "{{ include "appsmith.fullname" $ }}-{{ $secret.name }}"
  namespace: {{ include "appsmith.namespace" $ }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- $store := $secret.secretStoreRef | default $.Values.externalSecrets.secretStoreRef | default dict }}
    name: {{ $store.name | default "secretstore" }}
    kind: {{ $store.kind | default "SecretStore" }}
  target:
    name: "{{ include "appsmith.fullname" $ }}-{{ $secret.name }}"
    creationPolicy: Owner
  {{- /* Per-key mapping: rename individual remote keys to specific Secret keys. */}}
  {{- if $secret.data }}
  data:
    {{- range $entry := $secret.data }}
    - secretKey: {{ $entry.secretKey | quote }}
      remoteRef:
        key: {{ $entry.remoteRef.key | quote }}
        {{- if $entry.remoteRef.property }}
        property: {{ $entry.remoteRef.property | quote }}
        {{- end }}
        {{- if $entry.remoteRef.version }}
        version: {{ $entry.remoteRef.version | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- /* Bulk extract: pull all keys from one or more remote secrets verbatim. */}}
  {{- if $secret.dataFrom }}
  dataFrom:
    {{- toYaml $secret.dataFrom | nindent 4 }}
  {{- end }}
{{- end }}
